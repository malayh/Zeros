
# Main
$mainMod = SUPER

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move active workspace to a monitor (by id from `hyprctl monitors`) with mainMod + ALT + SHIFT + [0-9]
bind = $mainMod ALT SHIFT, 0, exec, custom-move-workspace-to-monitor 0
bind = $mainMod ALT SHIFT, 1, exec, custom-move-workspace-to-monitor 1
bind = $mainMod ALT SHIFT, 2, exec, custom-move-workspace-to-monitor 2
bind = $mainMod ALT SHIFT, 3, exec, custom-move-workspace-to-monitor 3
bind = $mainMod ALT SHIFT, 4, exec, custom-move-workspace-to-monitor 4
bind = $mainMod ALT SHIFT, 5, exec, custom-move-workspace-to-monitor 5
bind = $mainMod ALT SHIFT, 6, exec, custom-move-workspace-to-monitor 6
bind = $mainMod ALT SHIFT, 7, exec, custom-move-workspace-to-monitor 7
bind = $mainMod ALT SHIFT, 8, exec, custom-move-workspace-to-monitor 8
bind = $mainMod ALT SHIFT, 9, exec, custom-move-workspace-to-monitor 9

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize active window
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod CTRL, mouse:272, resizewindow


# Application bindings
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, exec, $HOME/.config/rofi/clipboard/past.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bindd = SUPER, F, Full screen, fullscreen, 0
bind = $mainMod, J, togglesplit,
bind = $mainMod, SPACE, exec, $HOME/.config/rofi/launcher/launcher.sh
bind = $mainMod SHIFT, SPACE, exec, $HOME/.config/rofi/sysmenu/sysmenu.sh
bind = $mainMod, L,  exec, $HOME/.config/rofi/powermenu/power.sh
bind = $mainMod SHIFT, T, exec, custom-launch-or-focus-tui btop 

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = SHIFT ,XF86MonBrightnessUp, exec, ddcutil --display=1 setvcp 10 + 10
bindel = SHIFT ,XF86MonBrightnessDown, exec, ddcutil --display=1 setvcp 10 - 10

# clamshell
# Lid opened
bindl=,switch:off:Lid Switch,exec,custom-activate-clamshell open

# Lid closed
bindl=,switch:on:Lid Switch,exec,custom-activate-clamshell close