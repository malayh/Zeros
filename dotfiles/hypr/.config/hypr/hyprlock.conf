general {
    ignore_empty_input = true
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    fail_timeout = 0
}

background {
    monitor =
    path = ~/.config/zeros/theme/currentwallpaper.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = false
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 185, 0, .6)
    font_size = 180
    font_family = JetBrainsMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

# Minute
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, .6)
    font_size = 180
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Day, Date, Month
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

# User icon
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, .65)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Hi, $USER
    hide_input = false
    check_color = rgba(255, 185, 0, 0.7)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 8
    shadow_passes = 0
    position = 0, -310
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
